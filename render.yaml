services:
  - type: web
    name: ipdf
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_BASE_URL
        value: https://router.huggingface.co/v1
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: TTS_PROVIDER
        value: browser
      - key: DATA_DIR
        value: /tmp/ipdf-data
