services:
  - type: web
    name: ipdf
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_BASE_URL
        value: https://router.huggingface.co/v1
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: TTS_PROVIDER
        value: browser
      - key: DATA_DIR
        value: /tmp/ipdf-data
      - key: APP_BASE_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: HOST_STORAGE_EPHEMERAL
        value: "true"
